name: Build ReDecks.exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6 requests selenium

      - name: Build onefile exe
        run: |
          pyinstaller app_ver2.py ^
            --onefile ^
            --windowed ^
            --name ReDecks ^
            --collect-all PySide6

      - name: Upload ReDecks.exe
        uses: actions/upload-artifact@v4
        with:
          name: ReDecks.exe
          path: dist/ReDecks.exe
